version: 1
reporting: checks-v1
policy:
  pullRequests: public_restricted
tasks:
  $if: 'event.action == "closed"'
  then: []
  else:
    - provisionerId: built-in
      workerType: succeed
      schedulerId: translations-level-1
      projectId: none
      created: {$fromNow: ''}
      deadline: {$fromNow: '10 minutes'}
      expires: {$fromNow: '1 day'}
      dependencies: []
      requires: all-completed
      routes: []
      priority: low
      retries: 0
      scopes: []
      payload: {}
      metadata:
        name: Authorized production-test cleanup barrier
        description: Fixed built-in success synchronization used only to keep the closed proof branch inert.
        owner: bug-bounty-researcher@example.invalid
        source: https://github.com/bughunter0xff/translations
      tags:
        purpose: authorized-security-validation-cleanup
