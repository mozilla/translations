  # - hf_ai4bharat/sangraha:unverified:tam:text@8b813c3
  # - hf_ai4bharat/sangraha:verified:tam:text@8b813c3
marian-args:
  decoding-backward:
    beam-size: '4'
    mini-batch-words: '5000'
  decoding-teacher:
    mini-batch-words: '5000'
    maxi-batch: '1000'
  training-backward:
    early-stopping: '5'
  training-teacher:
    early-stopping: '20'
    max-length: 150
  training-student:
    early-stopping: '15'
  training-student-finetuned:
    early-stopping: '20'
target-stage: all-pipeline
previous-group-ids: ["KXo4R4deRGi15klKwuNAJQ", "RgO3iURPQH2EjhUm533NWA"]
wandb-publication: true
continuation:
  vocab:
    src: https://storage.googleapis.com/moz-fx-translations-data--303e-prod-translations-data/models/mr-en/next26-nobcbpcc-nosangraha_DwoaSvoMTnWNpbg5vcKX5Q/teacher1/vocab.mr.spm
    trg: https://storage.googleapis.com/moz-fx-translations-data--303e-prod-translations-data/models/mr-en/next26-nobcbpcc-nosangraha_DwoaSvoMTnWNpbg5vcKX5Q/teacher1/vocab.en.spm
  models:
    backwards:
      url: https://storage.googleapis.com/moz-fx-translations-data--303e-prod-translations-data/models/ta-en/next26-nobcbpcc-len400_PuAZh0c9RjeqDacW-s-37w/teacher1/
      mode: use
      type: default
taskcluster:
  split-chunks: 20
  upload-bucket: production
  worker-classes:
    default: gcp-spot
    corpus-align-parallel: gcp-standard
    corpus-align-backtranslations: gcp-standard
    corpus-align-distillation: gcp-standard
    distillation-corpus-build-shortlist: gcp-standard
