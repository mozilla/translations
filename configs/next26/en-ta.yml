# The initial configuration was generated using:
# task config-generator -- --name next26 en ta
#
# The documentation for this config can be found here:
# https://github.com/mozilla/translations/blob/1979eb50e3adbed644d042fe6f9e4d0a1fe4ec71/taskcluster/configs/config.prod.yml
experiment:
  name: next26-nobcbpcc
  src: en
  trg: ta
  best-model: chrf
  opuscleaner-mode: custom
  archive-corpora: true
  bicleaner:
    default-threshold: 0.1
    dataset-thresholds:
      opus_CCAligned_v1: 0.5
      hfp_ai4bharat_BPCC_samanantar++_tam_Taml_src_tgt: 0
      hfp_ai4bharat_BPCC_samanantar-filtered_tam_Taml_src_tgt: 0
      hfp_ai4bharat_BPCC_nllb-filtered_tam_Taml_src_tgt: 0
      hfp_ai4bharat_BPCC_bpcc-seed-latest_tam_Taml_src_tgt: 0
      hfp_ai4bharat_BPCC_comparable_tam_Taml_src_tgt: 0
      hfp_ai4bharat_BPCC_daily_tam_Taml_src_tgt: 0
      hfp_ai4bharat_BPCC_ilci_tam_Taml_src_tgt: 0
  monocleaner:
    mono-src:
      default-threshold: 0.0
      dataset-thresholds:
        hplt_mono_v2_0: 0.5
        opus_NLLB_v1: 0.5
    mono-trg:
      default-threshold: 0.0
      dataset-thresholds:
        hplt_mono_v2_0: 0.7
        opus_NLLB_v1: 0.8
  mono-max-sentences-src:
    total: 100_000_000
    per-dataset: 70_000_000
  mono-max-sentences-trg:
    total: 100_000_000
    per-dataset: 70_000_000
  dev-max-sentences: 8000
  hplt-min-doc-score:
    mono-src: 7.0
    mono-trg: 7.0
  spm-sample-size: 6_000_000
  spm-vocab-size: 32000
  spm-vocab-split: false
  spm-norm-rule: nmt_nfkc
  teacher-ensemble: 1
  teacher-mode: two-stage
  teacher-decoder: ctranslate2
  student-model: base-memory
datasets:
  devtest:
  - flores_aug-mix_dev
  - sacrebleu_aug-mix_wmt20/dev
  - ntrex_aug-mix_test
  test:
  - flores_devtest
  - flores_aug-mix_devtest
  - flores_aug-noise_devtest
  - flores_aug-inline-noise_devtest
  - flores_aug-punct_devtest
  - flores_aug-title_devtest
  - flores_aug-upper_devtest
  - flores_aug-typos_devtest
  - sacrebleu_wmt20
  - ntrex_test
  - tmx_aug-short_pontoon

