# The initial configuration was generated using:
# task config-generator -- --name next26 en az
#
# The documentation for this config can be found here:
# https://github.com/mozilla/translations/blob/1979eb50e3adbed644d042fe6f9e4d0a1fe4ec71/taskcluster/configs/config.prod.yml
experiment:
  name: next26-localdoc
  src: en
  trg: az
  best-model: chrf
  opuscleaner-mode: custom
  archive-corpora: true
  bicleaner:
    default-threshold: 0.5
    dataset-thresholds: {}
  monocleaner:
    mono-src:
      default-threshold: 0.0
      dataset-thresholds:
        hplt_mono_v2_0: 0.5
        opus_NLLB_v1: 0.5
    mono-trg:
      default-threshold: 0.0
      dataset-thresholds:
        hplt_mono_v2_0: 0.7
        opus_NLLB_v1: 0.8
  mono-max-sentences-src:
    total: 100_000_000
    per-dataset: 70_000_000
  mono-max-sentences-trg:
    total: 100_000_000
    per-dataset: 70_000_000
  dev-max-sentences: 8000
  hplt-min-doc-score:
    mono-src: 7.0
    mono-trg: 7.0
  spm-sample-size: 6_000_000
  spm-vocab-size: 32000
  spm-vocab-split: false
  spm-norm-rule: nmt_nfkc
  teacher-ensemble: 1
  teacher-mode: two-stage
  teacher-decoder: ctranslate2
  student-model: base-memory
datasets:
  devtest:
  - flores_aug-mix_dev
  - ntrex_aug-mix_test
  test:
  - flores_devtest
  - flores_aug-mix_devtest
  - flores_aug-noise_devtest
  - flores_aug-inline-noise_devtest
  - flores_aug-punct_devtest
  - flores_aug-title_devtest
  - flores_aug-upper_devtest
  - flores_aug-typos_devtest
  - ntrex_test
  - tmx_aug-short_pontoon

  # The training data contains:
  #   79,842,659 sentences
  # 
  # Skipped datasets:
  #  - opus_CCMatrix/v1 - ignored datasets (1,251,254 sentences)
  #  - opus_ELRC-3059-wikipedia_health/v1 - not enough data  (130 sentences)
  #  - opus_ELRC-wikipedia_health/v1 - not enough data  (130 sentences)
  #  - opus_ELRC_2922/v1 - not enough data  (129 sentences)
  #  - opus_Ubuntu/v14.10 - not enough data  (0 sentences)
  #  - mtdata_Facebook-wikimatrix-1-aze-eng - duplicate with opus
  #  - mtdata_Statmt-ccaligned-1-aze_AZ-eng - duplicate with opus
  #  - mtdata_Statmt-ccaligned-1-aze_IR-eng - duplicate with opus
  train:
  - opus_NLLB/v1  #                                       74,519,429 sentences
  - opus_ParaCrawl-Bonus/v9 #                             3,158,089 sentences
  - opus_CCAligned/v1 #                                   1,174,345 sentences
  - opus_XLEnt/v1.2 #                                       298,237 sentences
  - opus_Tanzil/v1 #                                        276,957 sentences
  - opus_OpenSubtitles/v2024 #                              171,698 sentences
  - opus_WikiMatrix/v1 #                                     71,277 sentences
  - opus_wikimedia/v20260327 #                               59,734 sentences
  - opus_GNOME/v1 #                                          40,075 sentences
  - opus_translatewiki/v2026-07-01 #                         33,099 sentences
  - opus_QED/v2.0a #                                         16,442 sentences
  - opus_TED2020/v1 #                                        11,611 sentences
  - opus_NeuLab-TedTalks/v1 #                                 6,498 sentences
  - opus_Tatoeba/v2026-07-08 #                                5,168 sentences
  - hfp_LocalDoc/english-azerbaijani-parallel-corpus:default:train:en_text:az_text@348f88d
  - hfp_Tamazight-NLP/Weblate-Translations:en-az:train:source:target@ffc9c3c

  # The monolingual data contains:
  #   ~816,765,994 sentences
  #   Up to 70,000,000 sentences from HPLT
  mono-src:
  - news-crawl_news.2007  #              ~53,097 sentences
  - news-crawl_news.2008 #              ~79,646 sentences
  - news-crawl_news.2009 #               ~8,849 sentences
  - news-crawl_news.2010 #              ~61,946 sentences
  - news-crawl_news.2011 #              ~35,398 sentences
  - news-crawl_news.2012 #              ~35,398 sentences
  - news-crawl_news.2013 #          ~17,699,115 sentences
  - news-crawl_news.2014 #          ~17,699,115 sentences
  - news-crawl_news.2015 #          ~17,699,115 sentences
  - news-crawl_news.2016 #              ~17,699 sentences
  - news-crawl_news.2017 #          ~26,548,672 sentences
  - news-crawl_news.2018 #              ~44,247 sentences
  - news-crawl_news.2019
  - news-crawl_news.2020 #          ~44,247,787 sentences
  - news-crawl_news.2021 #          ~35,398,230 sentences
  - news-crawl_news.2022 #          ~53,097,345 sentences
  - news-crawl_news.2023 #          ~53,097,345 sentences
  - news-crawl_news.2024 #           ~8,849,557 sentences
  - news-crawl_news.2025 #          ~79,646,017 sentences
  - hplt_mono/v3.0 #           Up to 70,000,000 sentences
  - opus_NLLB/v1 #                 ~462,447,416 sentences

  # The monolingual data contains:
  #   ~9,995,534 sentences
  #   Up to 70,000,000 sentences from HPLT
  mono-trg:
  - hplt_mono/v3.0  #           Up to 70,000,000 sentences
  - opus_NLLB/v1 #                   ~9,995,534 sentences
  - hf_LocalDoc/court_cases_azerbaijani:default:train:sentence
  - hf_HuggingFaceFW/finepdfs-edu:azj_Latn:train:text
marian-args:
  decoding-backward:
    beam-size: '4'
    mini-batch-words: '5000'
  decoding-teacher:
    mini-batch-words: '5000'
    maxi-batch: '10000'
  training-backward:
    early-stopping: '5'
  training-teacher:
    valid-mini-batch: '32'
    early-stopping: '20'
  training-student:
    early-stopping: '15'
  training-student-finetuned:
    early-stopping: '20'
target-stage: evaluate-teacher
wandb-publication: true
continuation:
  models:
    backwards:
      url: https://storage.googleapis.com/moz-fx-translations-data--303e-prod-translations-data/models/az-en/next26_MBpE1p9sTeWCE7XKh-AY0Q/teacher1/
      mode: use
      type: default
taskcluster:
  split-chunks: 20
  upload-bucket: production
  worker-classes:
    default: gcp-spot
    corpus-align-parallel: gcp-standard
    corpus-align-backtranslations: gcp-standard
    corpus-align-distillation: gcp-standard
    distillation-corpus-build-shortlist: gcp-standard
