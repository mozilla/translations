marian-args:
  decoding-backward:
    beam-size: '1'
    mini-batch-words: '5000'
  decoding-teacher:
    mini-batch-words: '5000'
    maxi-batch: '10000'
  training-backward:
    early-stopping: '5'
  training-teacher:
    early-stopping: '20'
  training-student:
    early-stopping: '15'
  training-student-finetuned:
    early-stopping: '20'
target-stage: all-pipeline
previous-group-ids: ["NXUsSazqRle2wbst9HFodA", "VzMgfbemTeGIkDo3MMYntw"]
wandb-publication: true
continuation:
  models:
    backwards:
      url: https://storage.googleapis.com/moz-fx-translations-data--303e-prod-translations-data/models/en-ru/student_base_BopzyYM4TA6cnARBJ4S7tA/student/
      mode: use
      type: default
taskcluster:
  split-chunks: 20
  upload-bucket: production
  worker-classes:
    default: gcp-spot
    corpus-align-parallel: gcp-standard
    corpus-align-backtranslations: gcp-standard
    corpus-align-distillation: gcp-standard
    distillation-corpus-build-shortlist: gcp-standard
