# The initial configuration was generated using:
# task config-generator -- --name next26 ru en
#
# The documentation for this config can be found here:
# https://github.com/mozilla/translations/blob/1979eb50e3adbed644d042fe6f9e4d0a1fe4ec71/taskcluster/configs/config.prod.yml
experiment:
  name: next26
  src: ru
  trg: en
  best-model: chrf
  opuscleaner-mode: custom
  archive-corpora: true
  bicleaner:
    default-threshold: 0.5
    dataset-thresholds: {}
  monocleaner:
    mono-src:
      default-threshold: 0.0
      dataset-thresholds:
        hplt_mono_v2_0: 0.5
        opus_NLLB_v1: 0.5
    mono-trg:
      default-threshold: 0.0
      dataset-thresholds:
        hplt_mono_v2_0: 0.7
        opus_NLLB_v1: 0.8
  mono-max-sentences-src:
    total: 100_000_000
    per-dataset: 70_000_000
  mono-max-sentences-trg:
    total: 100_000_000
    per-dataset: 70_000_000
  dev-max-sentences: 8000
  hplt-min-doc-score:
    mono-src: 7.0
    mono-trg: 8.0
  spm-sample-size: 6_000_000
  spm-vocab-size: 32000
  spm-vocab-split: false
  spm-norm-rule: nmt_nfkc
  teacher-ensemble: 1
  teacher-mode: one-stage
  teacher-decoder: ctranslate2
  student-model: base-memory
datasets:
  devtest:
  - flores_aug-mix_dev
  - sacrebleu_aug-mix_wmt18
  - sacrebleu_aug-mix_wmt17
  - sacrebleu_aug-mix_wmt15
  - sacrebleu_aug-mix_wmt14/full
  - ntrex_aug-mix_test
  test:
  - flores_devtest
  - flores_aug-mix_devtest
  - flores_aug-noise_devtest
  - flores_aug-inline-noise_devtest
  - flores_aug-punct_devtest
  - flores_aug-title_devtest
  - flores_aug-upper_devtest
  - flores_aug-typos_devtest
  - sacrebleu_wmt23
  - sacrebleu_wmt22
  - sacrebleu_wmt21/systems
  - sacrebleu_wmt21/B
  - sacrebleu_wmt20/tworefs
  - sacrebleu_wmt19
  - sacrebleu_wmt18/test-ts
  - sacrebleu_wmt16
  - sacrebleu_wmt14
  - sacrebleu_wmt13
  - sacrebleu_mtedx/test
  - ntrex_test
  - tmx_aug-short_pontoon

