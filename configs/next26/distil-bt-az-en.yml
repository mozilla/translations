  - url_https://firefox-ci-tc.services.mozilla.com/api/queue/v1/task/ZJ4WyiewT_Soquk6iQux_w/runs/1/artifacts/public/build/mono_v3_0.en.zst
  # - opus_NLLB/v1 #                 ~462,447,416 sentences
marian-args:
  decoding-backward:
    beam-size: '4'
    mini-batch-words: '5000'
  decoding-teacher:
    mini-batch-words: '5000'
    maxi-batch: '10000'
  training-backward:
    early-stopping: '5'
  training-teacher:
    beam-size: '4'
    valid-mini-batch: '64'
    early-stopping: '20'
  training-student:
    early-stopping: '15'
  training-student-finetuned:
    early-stopping: '20'
target-stage: all-pipeline
previous-group-ids: ["Ksg0bVglSZOyiWjMhA8fAA", "MBpE1p9sTeWCE7XKh-AY0Q"]
wandb-publication: true
continuation:
  models:
    backwards:
      url: https://storage.googleapis.com/moz-fx-translations-data--303e-prod-translations-data/models/en-az/h1-2025_fu1HFuR0QY-zVBcKYQkJIA/teacher0/
      mode: use
      type: default
taskcluster:
  split-chunks: 20
  upload-bucket: production
  worker-classes:
    default: gcp-spot
    corpus-align-parallel: gcp-standard
    corpus-align-backtranslations: gcp-standard
    corpus-align-distillation: gcp-standard
    distillation-corpus-build-shortlist: gcp-standard
